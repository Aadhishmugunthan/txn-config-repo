spring:
  application:
    name: TransactionConsumer
  cloud:
    config:
      uri: http://localhost:8888
      fail-fast: true

management:
  endpoints:
    web:
      exposure:
        include: refresh,health,info

# Externalized Transaction Mappings
txn:
  mappings:
    PAYMENT:
      transaction:
        TXN_TYPE:
          source: constant
          value: PAYMENT
          required: true
          
        AMOUNT:
          source: json
          path: $.amount
          required: true
          validation:
            min: 0
            max: 999999999
            
        CURRENCY:
          source: json
          path: $.currency
          required: true
          validation:
            pattern: "^[A-Z]{3}$"
            
        SOURCE_SYSTEM:
          source: json
          path: $.sourceSystem
          required: false
          defaultValue: "MOBILE_APP"
          
        TRAN_ID:
          source: json
          path: $.transactionId
          required: true
          
        CUST_REF_NUM:
          source: json
          path: $.customerReferenceNumber
          required: false
          
        ORIG_INST_NAM:
          source: json
          path: $.originatingInstitution
          required: false
          
        TRANFR_ACPT_NAM:
          source: json
          path: $.transferAcceptorName
          required: false
    
    SENDER:
      party:
        PARTY_TYPE:
          source: constant
          value: SENDER
          
        FIRST_NAME:
          source: json
          path: $.sender.firstName
          required: true
          validation:
            maxLength: 80
            
        LAST_NAME:
          source: json
          path: $.sender.lastName
          required: true
          validation:
            maxLength: 80
            
        EMAIL:
          source: json
          path: $.sender.email
          required: true
          validation:
            pattern: "^[A-Za-z0-9+_.-]+@(.+)$"
            
        PHONE:
          source: json
          path: $.sender.phone
          required: false
          validation:
            pattern: "^\\+?[1-9]\\d{1,14}$"
            
        CITY:
          source: json
          path: $.sender.city
          required: false
          
        COUNTRY:
          source: json
          path: $.sender.country
          required: true
          validation:
            pattern: "^[A-Za-z\\s]+$"

      address:
        ADDR_TYPE:
          source: constant
          value: SENDER_BILLING
          
        STREET_LINE_1:
          source: json
          path: $.sender.address.streetLine1
          required: true
          validation:
            maxLength: 250
            
        STREET_LINE_2:
          source: json
          path: $.sender.address.streetLine2
          required: false
          validation:
            maxLength: 250
            
        CITY:
          source: json
          path: $.sender.address.city
          required: true
          
        STATE:
          source: json
          path: $.sender.address.state
          required: true
          
        COUNTRY:
          source: json
          path: $.sender.address.country
          required: true
          
        POSTAL_CODE:
          source: json
          path: $.sender.address.postalCode
          required: true
          validation:
            pattern: "^[0-9]{5,10}$"
   
    RECIPIENT:
      party:
        PARTY_TYPE:
          source: constant
          value: RECIPIENT
          
        FIRST_NAME:
          source: json
          path: $.recipient.firstName
          required: true
          validation:
            maxLength: 80
            
        LAST_NAME:
          source: json
          path: $.recipient.lastName
          required: true
          validation:
            maxLength: 80
            
        EMAIL:
          source: json
          path: $.recipient.email
          required: true
          validation:
            pattern: "^[A-Za-z0-9+_.-]+@(.+)$"
            
        PHONE:
          source: json
          path: $.recipient.phone
          required: false
          
        CITY:
          source: json
          path: $.recipient.city
          required: false
          
        COUNTRY:
          source: json
          path: $.recipient.country
          required: true

      address:
        ADDR_TYPE:
          source: constant
          value: RECIPIENT_SHIPPING
          
        STREET_LINE_1:
          source: json
          path: $.recipient.address.streetLine1
          required: true
          
        STREET_LINE_2:
          source: json
          path: $.recipient.address.streetLine2
          required: false
          
        CITY:
          source: json
          path: $.recipient.address.city
          required: true
          
        STATE:
          source: json
          path: $.recipient.address.state
          required: true
          
        COUNTRY:
          source: json
          path: $.recipient.address.country
          required: true
          
        POSTAL_CODE:
          source: json
          path: $.recipient.address.postalCode
          required: true
    
    TRANSACTION_DETAIL:
      detail:
        PAYMENT_REF:
          source: json
          path: $.paymentReference
          required: true
          
        FUNDING_SOURCE:
          source: json
          path: $.fundingSource
          required: true
          validation:
            allowed: 
              - CREDIT_CARD
              - DEBIT_CARD
              - BANK_ACCOUNT
              - UPI
              - WALLET
              
        PAYMENT_TYPE:
          source: json
          path: $.paymentType
          required: true
          validation:
            allowed:
              - ONLINE
              - OFFLINE
              - RECURRING
              - INSTANT
              - WIRE_TRANSFER
