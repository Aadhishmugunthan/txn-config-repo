spring:
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/FREEPDB1
    username: SEND_TXN_OWNER
    password: 1234
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 5
      connection-test-query: SELECT 1 FROM DUAL
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.OracleDialect

management:
  endpoints:
    web:
      exposure:
        include: refresh,health,info

        
txn:
  mappings:

    # ================= SENDER PARTY MAPPING =================
    sender:
      party:
        FIRST_NAME:
          source: json
          path: $.sender.firstName
          required: true

        LAST_NAME:
          source: json
          path: $.sender.lastName
          required: true

        EMAIL:
          source: json
          path: $.sender.email
          required: true
          validation:
            pattern: "^[A-Za-z0-9+_.-]+@(.+)$"

        PHONE:
          source: json
          path: $.sender.phone
          required: false

        CITY:
          source: json
          path: $.sender.city
          required: false

        COUNTRY:
          source: json
          path: $.sender.country
          required: true

    # ================= RECIPIENT PARTY MAPPING =================
    recipient:
      party:
        FIRST_NAME:
          source: json
          path: $.recipient.firstName
          required: true

        LAST_NAME:
          source: json
          path: $.recipient.lastName
          required: true

        EMAIL:
          source: json
          path: $.recipient.email
          required: true
          validation:
            pattern: "^[A-Za-z0-9+_.-]+@(.+)$"

        PHONE:
          source: json
          path: $.recipient.phone
          required: false

        CITY:
          source: json
          path: $.recipient.city
          required: false

        COUNTRY:
          source: json
          path: $.recipient.country
          required: true

    # ================= TWO ADDRESS TABLE ENTRIES =================
    address:
      sender:
        ID:
          source: generated
        ADDR_TYPE:
          source: constant
          value: SENDER_BILLING
        STREET_LINE_1:
          source: json
          path: $.sender.address.streetLine1
        STREET_LINE_2:
          source: json
          path: $.sender.address.streetLine2
        CITY:
          source: json
          path: $.sender.address.city
        STATE:
          source: json
          path: $.sender.address.state
        COUNTRY:
          source: json
          path: $.sender.address.country
        POSTAL_CODE:
          source: json
          path: $.sender.address.postalCode

      recipient:
        ID:
          source: generated
        ADDR_TYPE:
          source: constant
          value: RECIPIENT_SHIPPING
        STREET_LINE_1:
          source: json
          path: $.recipient.address.streetLine1
        STREET_LINE_2:
          source: json
          path: $.recipient.address.streetLine2
        CITY:
          source: json
          path: $.recipient.address.city
        STATE:
          source: json
          path: $.recipient.address.state
        COUNTRY:
          source: json
          path: $.recipient.address.country
        POSTAL_CODE:
          source: json
          path: $.recipient.address.postalCode
